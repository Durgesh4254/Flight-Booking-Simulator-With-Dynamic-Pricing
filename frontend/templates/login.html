{% extends 'base.html' %}

{% block title %}Login - FlyEase{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card glass">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to manage your flights and enjoy personalized dynamic pricing.</p>
    </div>
    
    <form id="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username"><i class="fa-solid fa-user"></i> Email or Username</label>
        <input type="text" id="username" name="username" class="form-control" required placeholder="Enter your email or username">
      </div>
      
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
      </div>
      
      <button type="submit" class="btn btn-primary w-100 mt-3">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>
    
    <div class="auth-footer text-center mt-3">
      <p>Don't have an account? <a href="/register/" class="text-gradient">Sign up here</a></p>
    </div>
  </div>
</div>
{% endblock %}
